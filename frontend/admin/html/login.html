<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin and Doctor Login page</title>
    <link rel="stylesheet" href="/frontend/admin/css/login.css">
</head>
<body>
    <div class="admin-login-container">
        <h1>Admin Login</h1>
        <form id="admin-login-form">
            <label for="email">Email</label><br>
            <input type="email" id="a-email" required><br><br>

            <label for="password">Password</label><br>
            <input type="password" id="a-password" required><br><br>

            <button type="submit">Login</button>
        </form>


    </div>
    <div class="doctor-login-container">
        <h1>Doctor Login</h1>
        <form id="doctor-login-form">
            <label for="email">Email</label><br>
            <input type="email" id="d-email" required><br><br>    
            <button type="submit">Login</button>
        </form>
    </div>
    <script src="/frontend/admin/js/login.js"></script>

</body>
</html>
