<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>patient register</title>
    <link rel="stylesheet" href="/patient/css/register.css">
</head>

<body>
    <form id="register-form">
        <h1>Patient Register</h1>
        <label for="name">Patient Name</label><br>
        <input type="text" id="name" required><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" required><br>

        <label for="password">password</label><br>
        <input type="password" id="password" required><br>


        <label for="gender">Gender</label><br>
        <input type="text" id="gender" required><br>

        <label for="age">Age</label><br>
        <input type="number" id="age" min="0" max="100" required><br>


        <label for="phno">Phone No.</label><br>
        <input type="tel" id="phno" required><br>


        <label for="address">Address</label><br>
        <input type="text" id="address" re><br>


        <button type="submit">Register</button><br><br>
        <a href="/patient/html/login.html">Login</a>


    </form>
    <script src="/patient/js/register.js"></script>
</body>
</html>
